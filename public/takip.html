<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - Canlı Sipariş Takibi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full bg-slate-900 p-4">

  <div class="max-w-xl mx-auto space-y-4 pb-12">
    <!-- ÜST BAR -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="text-base font-black" id="page-title">Canlı Sipariş Takibi</h1>
      </div>
      <a id="back-to-menu-btn" href="/" class="bg-slate-800 hover:bg-slate-700 text-xs px-3.5 py-2 rounded-xl font-bold border border-slate-700 flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrow-left"></i> Menüye Dön
      </a>
    </div>

    <!-- SİPARİŞ KARTLARI LİSTESİ -->
    <div id="orders-list-container" class="space-y-3">
      <div class="p-12 text-center text-slate-500 text-xs bg-slate-800/40 rounded-3xl border border-slate-800">
        Yükleniyor veya aktif sipariş bulunamadı...
      </div>
    </div>
  </div>

  <script>
    let currentTable = null;

    function parseAndFormatTable(raw) {
      if (!raw) return null;
      let cleaned = decodeURIComponent(raw).trim();
      let match = cleaned.match(/\d+/);
      if (match) {
        let num = parseInt(match[0], 10);
        if (num >= 1 && num <= 20) {
          return `Masa ${num < 10 ? '0' + num : num}`;
        }
      }
      return cleaned;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let masaParam = urlParams.get('masa') || urlParams.get('table') || urlParams.get('m');

      if (masaParam) {
        currentTable = parseAndFormatTable(masaParam);
        if (currentTable) {
          // URL'de hangi masa varsa kesin olarak onu sabitle
          localStorage.setItem('evreka_customer_table', currentTable);
        }
      } else {
        // URL'de yoksa depolamadakini al
        currentTable = localStorage.getItem('evreka_customer_table') || null;
      }

      if (!currentTable) {
        window.location.href = '/';
        return;
      }

      document.getElementById('page-title').innerText = `${currentTable} - Canlı Takip`;
      document.getElementById('back-to-menu-btn').href = `/?masa=${encodeURIComponent(currentTable)}`;

      fetchAndRenderTracker();
      setInterval(fetchAndRenderTracker, 1000);
    });

    // 🔒 SADECE AKTİF MASAYA AİT SİPARİŞ ID'LERİNİ GETİRİR
    function getTableOrderIds() {
      if (!currentTable) return [];
      const list = localStorage.getItem(`evreka_orders_${currentTable}`);
      return list ? JSON.parse(list) : [];
    }

    async function fetchAndRenderTracker() {
      const orderIds = getTableOrderIds();
      const container = document.getElementById('orders-list-container');

      if (orderIds.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center text-slate-400 text-xs bg-slate-800/50 rounded-3xl border border-slate-800 space-y-3">
            <i class="fa-solid fa-receipt text-3xl text-slate-600"></i>
            <p>Henüz ${currentTable} için aktif siparişiniz bulunmuyor.</p>
            <a href="/?masa=${encodeURIComponent(currentTable)}" class="inline-block bg-red-600 text-white font-bold px-4 py-2 rounded-xl">Menüye Git & Sipariş Ver</a>
          </div>`;
        return;
      }

      let allOrders = [];
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success && Array.isArray(data.orders)) allOrders = data.orders;
      } catch (e) {}

      const localStatuses = JSON.parse(localStorage.getItem('evreka_order_statuses') || '{}');

      // Sadece bu masaya ait olan siparişleri filtrele
      const myOrders = allOrders.filter(o => orderIds.includes(String(o.id)));

      if (myOrders.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-500 text-xs bg-slate-800/40 rounded-3xl border border-slate-800">Sipariş verileriniz senkronize ediliyor...</div>';
        return;
      }

      container.innerHTML = myOrders.map(o => {
        const strId = String(o.id);
        let rawStatus = String(o.status || localStatuses[strId] || 'WAITING').toUpperCase().trim();

        let activeStep = 0; 
        let statusBg = "bg-amber-500/10 border-amber-500/30 text-amber-400";
        let statusMsg = "⏳ Siparişiniz garson onayında, mutfağa iletiliyor...";

        const servedVariants = ['SERVED', 'SERVICED', 'DELIVERED', 'READY', 'COMPLETED', 'DONE', 'FINISHED', 'IN_SERVICE', 'KITCHEN_DONE', 'HAZIR', 'SERVIS_EDILDI'];

        if (servedVariants.includes(rawStatus)) {
          activeStep = 2; 
          statusBg = "bg-indigo-500/20 border-indigo-500/50 text-indigo-300 font-extrabold animate-pulse shadow-lg shadow-indigo-500/20";
          statusMsg = "🍽️ Siparişiniz masanıza servis edildi. Afiyet olsun!";
        } else if (rawStatus === 'PREPARING' || rawStatus === 'MUTFAK' || rawStatus === 'PISIRIYOR') {
          activeStep = 1;
          statusBg = "bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
          statusMsg = "🔥 Siparişiniz mutfakta fırına verildi, pişim aşamasında!";
        } else if (rawStatus === 'PAID' || rawStatus === 'ODENDI') {
          activeStep = 3;
          statusBg = "bg-slate-700 border-slate-600 text-slate-300";
          statusMsg = "✅ Ödemeniz alındı. Teşekkür ederiz!";
        }

        const itemsHtml = (o.items || []).map(i => `
          <div class="flex justify-between items-center text-xs bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40">
            <div>
              <span class="font-extrabold text-slate-200">${i.title}</span>
              ${i.size ? `<span class="text-red-400 font-bold ml-1">(${i.size})</span>` : ''}
              ${i.note ? `<p class="text-[10px] text-amber-400 italic mt-0.5"><i class="fa-solid fa-comment-dots"></i> Not: "${i.note}"</p>` : ''}
            </div>
            <span class="font-black text-white whitespace-nowrap">${i.price} ₺</span>
          </div>
        `).join('');

        return `
          <div class="bg-slate-800 border border-slate-700/80 rounded-3xl p-5 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
              <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white font-black text-xs px-3 py-1 rounded-xl">Sipariş #${o.id}</span>
              </div>
              <span class="text-sm font-black text-amber-400">${o.totalPrice} ₺</span>
            </div>

            <div class="space-y-2">
              ${itemsHtml}
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700/60 text-center">
              <div class="flex flex-col items-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs ${activeStep >= 0 ? 'bg-amber-500 text-slate-950 font-black shadow-lg shadow-amber-500/40' : 'bg-slate-700 text-slate-500'}">
                  <i class="fa-solid fa-hourglass-half"></i>
                </div>
                <span class="text-[10px] ${activeStep === 0 ? 'text-amber-400 font-black' : 'text-slate-400'}">1. Onay</span>
              </div>

              <div class="flex flex-col items-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs ${activeStep >= 1 ? 'bg-emerald-500 text-slate-950 font-black shadow-lg shadow-emerald-500/40' : 'bg-slate-700 text-slate-500'}">
                  <i class="fa-solid fa-fire"></i>
                </div>
                <span class="text-[10px] ${activeStep === 1 ? 'text-emerald-400 font-black' : 'text-slate-400'}">2. Mutfak</span>
              </div>

              <div class="flex flex-col items-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs ${activeStep >= 2 ? 'bg-indigo-500 text-white font-black shadow-lg shadow-indigo-500/60 animate-bounce' : 'bg-slate-700 text-slate-500'}">
                  <i class="fa-solid fa-utensils"></i>
                </div>
                <span class="text-[10px] ${activeStep >= 2 ? 'text-indigo-400 font-black' : 'text-slate-400'}">3. Masada</span>
              </div>
            </div>

            <div class="text-xs px-3 py-2.5 rounded-2xl border font-bold ${statusBg} flex items-center justify-center text-center">
              <span>${statusMsg}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
