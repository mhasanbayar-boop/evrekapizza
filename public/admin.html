<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - Kompakt POS & Garson Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full bg-slate-900 p-3 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-4 pb-12">
    <!-- ÜST KÜÇÜK POS BARI -->
    <div class="bg-slate-800 border border-slate-700 px-4 py-3 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="text-xl">🍕</span>
        <div>
          <h1 class="text-sm font-black text-white">POS / Garson Paneli</h1>
          <p class="text-[10px] text-slate-400">Canlı Adisyon & Hızlı İşlem</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex-1 text-center">
          <span class="text-[9px] text-slate-400 font-bold uppercase block">Ciro</span>
          <span id="total-revenue" class="text-xs font-black text-amber-400">0 ₺</span>
        </div>
        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex-1 text-center">
          <span class="text-[9px] text-slate-400 font-bold uppercase block">Adet</span>
          <span id="total-orders-count" class="text-xs font-black text-emerald-400">0</span>
        </div>
        <button onclick="loadAdminOrders()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>

    <!-- SİPARİŞ LİSTESİ (Kompakt POS Kartları) -->
    <div id="admin-orders-container" class="space-y-3">
      <div class="p-8 text-center text-slate-500 text-xs bg-slate-800/40 rounded-2xl border border-slate-800">
        Siparişler yükleniyor...
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAdminOrders();
      setInterval(loadAdminOrders, 1500); // Canlı senkronizasyon
    });

    async function loadAdminOrders() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success && Array.isArray(data.orders)) {
          renderAdminOrders(data.orders);
        }
      } catch (err) {
        console.error("Siparişler çekilemedi, localStorage yedek kaynağa bakılıyor...", err);
      }
    }

    function renderAdminOrders(orders) {
      const container = document.getElementById('admin-orders-container');
      const localStatuses = JSON.parse(localStorage.getItem('evreka_order_statuses') || '{}');

      // Durumları eşitle
      const processedOrders = orders.map(o => ({
        ...o,
        status: localStatuses[String(o.id)] || o.status || 'WAITING'
      }));

      // Toplam Hesaplamalar
      const totalRev = processedOrders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);
      document.getElementById('total-revenue').innerText = `${totalRev} ₺`;
      document.getElementById('total-orders-count').innerText = processedOrders.length;

      if (processedOrders.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-500 text-xs bg-slate-800/40 rounded-2xl border border-slate-800 space-y-1">
            <i class="fa-solid fa-inbox text-2xl text-slate-600"></i>
            <p>Aktif sipariş bulunmuyor.</p>
          </div>`;
        return;
      }

      // EN YENİLER EN ÜSTTE (Unshift / Reverse mantığı)
      const sorted = [...processedOrders].reverse();

      container.innerHTML = sorted.map(o => {
        let statusTag = '';
        let statusStr = String(o.status).toUpperCase().trim();

        if (statusStr === 'WAITING') {
          statusTag = '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[9px] font-black px-2 py-0.5 rounded-lg">⏳ Onay Bekliyor</span>';
        } else if (statusStr === 'PREPARING') {
          statusTag = '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-black px-2 py-0.5 rounded-lg">🔥 Mutfakta</span>';
        } else if (statusStr === 'SERVED') {
          statusTag = '<span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[9px] font-black px-2 py-0.5 rounded-lg">🍽️ Serviste</span>';
        } else if (statusStr === 'PAID') {
          statusTag = '<span class="bg-slate-700 text-slate-300 border border-slate-600 text-[9px] font-black px-2 py-0.5 rounded-lg">✅ Ödendi</span>';
        }

        const itemsHtml = (o.items || []).map(i => `
          <div class="flex justify-between items-center text-[11px] bg-slate-900/50 px-2.5 py-1.5 rounded-lg border border-slate-700/30">
            <div>
              <span class="font-bold text-slate-200">${i.title}</span>
              ${i.size ? `<span class="text-red-400 font-bold ml-1">(${i.size})</span>` : ''}
              ${i.note ? `<span class="text-[10px] text-amber-400 italic ml-1">(${i.note})</span>` : ''}
            </div>
            <span class="font-black text-white">${i.price} ₺</span>
          </div>
        `).join('');

        return `
          <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-3.5 shadow-md space-y-2.5">
            <!-- Başlık Satırı -->
            <div class="flex items-center justify-between gap-2 border-b border-slate-700/50 pb-2">
              <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white font-black text-[11px] px-2.5 py-1 rounded-xl shadow">${o.tableName}</span>
                <span class="text-slate-400 text-[10px] font-mono">#${o.id}</span>
                ${statusTag}
              </div>
              <span class="text-sm font-black text-amber-400">${o.totalPrice} ₺</span>
            </div>

            <!-- Ürünler (Kompakt Liste) -->
            <div class="space-y-1">
              ${itemsHtml}
            </div>

            <!-- POS Buton Satırı -->
            <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-slate-700/50">
              <button onclick="updateOrderStatus(${o.id}, 'PREPARING')" class="bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold text-[10px] py-2 px-2 rounded-xl transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-fire"></i> Mutfak
              </button>
              <button onclick="updateOrderStatus(${o.id}, 'SERVED')" class="bg-indigo-600/90 hover:bg-indigo-500 text-white font-bold text-[10px] py-2 px-2 rounded-xl transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-utensils"></i> Servis Et
              </button>
              <button onclick="updateOrderStatus(${o.id}, 'PAID')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-[10px] py-2 px-2 rounded-xl transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-check"></i> Ödendi
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateOrderStatus(orderId, newStatus) {
      // 1. Önce localStorage'a anında kaydet ve arayüzü güncelle (Gecikmesiz POS tepkisi)
      let localStatuses = JSON.parse(localStorage.getItem('evreka_order_statuses') || '{}');
      localStatuses[String(orderId)] = newStatus;
      localStorage.setItem('evreka_order_statuses', JSON.stringify(localStatuses));
      
      // Anında ekrana yansıt
      loadAdminOrders();

      // 2. Arka planda sunucuya da bildir (Hata verse bile arayüz kırılmaz)
      fetch(`/api/orders/${orderId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      }).catch(err => console.log("API arka plan senkronizasyon uyarısı:", err));
    }
  </script>
</body>
</html>
